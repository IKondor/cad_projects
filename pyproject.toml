[project]
name = "cad-projects"
version = "0.0.0"
description = "Монорепо CAD-проектов: параметрические модели на CadQuery"
requires-python = ">=3.12,<3.13"
dependencies = []

# Корень — не пакет, а только контейнер workspace'а.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "projects/*"]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cadkit"]
